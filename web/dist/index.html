    <script src="/config.js"></script>
    <script>
      /*
        Stale-bundle self-heal.

        Vite fingerprints every build, so a deploy makes the previous /assets/index-<hash>.js
        return 404. A browser holding the older HTML then loads a script that no longer exists:
        the page paints its background and nothing else runs, which looks like a blank screen
        rather than an error. index.html is served no-store now, but a browser that cached it
        BEFORE that header shipped can stay stuck in that state through ordinary reloads.

        So: if the app has not mounted shortly after load, fetch index.html bypassing the cache
        and compare its bundle to the one this page is running. If they differ, this document is
        stale — reload once (guarded by sessionStorage, so a genuine failure cannot loop).
      */
      (function () {
        var KEY = "wn_reload_once";
        function bundleOf(html) {
          var m = /assets\/(index-[A-Za-z0-9_-]+\.js)/.exec(html || "");
          return m && m[1];
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }
            try { if (sessionStorage.getItem(KEY)) return; } catch (e) { return; }
            var mine = bundleOf(document.documentElement.innerHTML);
            fetch(window.location.pathname, { cache: "reload", credentials: "same-origin" })
              .then(function (r) { return r.text(); })
              .then(function (html) {
                if (bundleOf(html) && bundleOf(html) !== mine) {
                  try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
                  window.location.reload();
                }
              })
              .catch(function () {});
          }, 4000);
        });
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-vxzqqnVx.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-e4EeF6oe.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:system-ui">WellNest needs JavaScript for booking. You can also call the front desk on 080 4000 1234. For an emergency call 108.</p></noscript>
  </body>
