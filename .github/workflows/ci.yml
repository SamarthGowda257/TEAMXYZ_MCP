name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16      # Postgres 16 + pgvector, like Supabase
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wellnest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest     # nothing else: what Render installs is what the server gets
      - name: Unit tests (SQLite)
        run: python -m pytest -q tests
        env:
          MCP_BEARER_TOKEN: ci-token
      - name: Start server on Postgres
        run: |
          nohup python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -s localhost:8000/health | grep '"db_kind":"postgres"'
          curl -s localhost:8000/health | grep '"events":"redis-streams"'
          curl -s localhost:8000/health | grep '"search":"hybrid"'
        env:
          REDIS_URL: redis://localhost:6379/0
          MCP_BEARER_TOKEN: ci-token
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wellnest
          PORT: "8000"
          EMBEDDINGS_PROVIDER: hash          # local stand-in so all three search legs run; real model: search-live.yml
      - name: Hybrid search evaluation (keyword, typo, code and off-topic questions must all pass)
        run: python scripts/eval_search.py --require keyword,typo,code,negative
        env:
          SEARCH_URL: http://localhost:8000
          DASHBOARD_TOKEN: ci-token
      - name: MCP acceptance checks (34) over the real transport
        run: python scripts/smoke_mcp.py
        env:
          MCP_URL: http://localhost:8000/mcp
          MCP_BEARER_TOKEN: ci-token
      - name: Server log on failure
        if: failure()
        run: tail -100 server.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build the website
        working-directory: frontend
        run: npm ci && npm run build
