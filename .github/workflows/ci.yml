name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wellnest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Unit tests (SQLite)
        run: python -m pytest -q tests
        env:
          MCP_BEARER_TOKEN: ci-token
      - name: Start server on Postgres
        run: |
          nohup python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -s localhost:8000/health | grep '"db_kind":"postgres"'
        env:
          MCP_BEARER_TOKEN: ci-token
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wellnest
          PORT: "8000"
      - name: MCP acceptance checks (30) over the real transport
        run: python scripts/smoke_mcp.py
        env:
          MCP_URL: http://localhost:8000/mcp
          MCP_BEARER_TOKEN: ci-token
      - name: Server log on failure
        if: failure()
        run: tail -100 server.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build the website
        working-directory: frontend
        run: npm ci && npm run build
