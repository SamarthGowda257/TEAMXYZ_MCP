name: Search eval (real embeddings)

# Manual only: it spends Gemini free-tier quota (~95 knowledge passages, a few patient notes, ~30 queries).
# Best with a key from a separate Google project, so it never uses the live server's daily quota.
# Needs the repository secret EMBEDDINGS_API_KEY (Google AI Studio key). Read-only for every external system.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wellnest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the secret is set
        run: test -n "$EMBEDDINGS_API_KEY" || (echo "Add the EMBEDDINGS_API_KEY repository secret first" && exit 1)
        env:
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
      - name: Start server with Gemini embeddings and wait for the backfill
        run: |
          nohup python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -s localhost:8000/health | grep '"search":"hybrid"'
          for i in $(seq 1 30); do
            s=$(curl -s "localhost:8000/api/ops/system?token=ci-token" | python -c "import json,sys; s=json.load(sys.stdin)['search']; e=s['embeddings']; print(s.get('kb_embedded',0), s.get('kb_total',0), e['breaker_open'], e['last_quota'], '|', e['last_error'])")
            echo "kb_embedded kb_total breaker quota | error: $s"
            set -- $s; [ "$1" -gt 0 ] && [ "$1" -ge "$2" ] && break
            [ "$3" = "True" ] && echo "Gemini refused (see error above); evaluating without the meaning leg" && break
            sleep 5
          done
          echo "Waiting 65 s so the evaluation's questions get a fresh per-minute quota"
          sleep 65
        env:
          MCP_BEARER_TOKEN: ci-token
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wellnest
          PORT: "8000"
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
      - name: Evaluate (prints hit rates per question type and the cosine calibration)
        run: python scripts/eval_search.py --require keyword,typo,code,negative
        env:
          SEARCH_URL: http://localhost:8000
          DASHBOARD_TOKEN: ci-token
      - name: MCP acceptance checks over the real transport
        run: python scripts/smoke_mcp.py
        env:
          MCP_URL: http://localhost:8000/mcp
          MCP_BEARER_TOKEN: ci-token
      - name: Server log
        if: always()
        run: grep -iE "embedd|search|warn|error" server.log | tail -60
